    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Detect Apple iOS Home Screen Standalone PWA immediately before first paint
      if (window.navigator && window.navigator.standalone === true) {
        document.documentElement.classList.add('is-ios-standalone');
      }

      // Service Worker Registration for PWA Offline Support & Foreground Update Check
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              registration.update().catch(() => {});

              // Also check for SW updates when app returns to foreground after being backgrounded
              let lastSwCheck = Date.now();
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && Date.now() - lastSwCheck > 5 * 60 * 1000) {
                  lastSwCheck = Date.now();
                  registration.update().catch(() => {});
                }
              });
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
